[project]
name = "buzzard-code"
version = "1.0.0"
description = "Buzzard Code — terminal coding agent that must prove its work"
readme = "README.md"
authors = [
    { name = "balax-24", email = "balaharish0202@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "pydantic>=2.6.4",
    "playwright>=1.62.0",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

[project.scripts]
buzzard = "security_agent.cli.main:main"
buzzard-code = "security_agent.cli.main:main"
security-agent = "security_agent.cli.main:main"
qsecurity = "security_agent.tui.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
training = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "accelerate>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["security_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "tokenizers>=0.23.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
